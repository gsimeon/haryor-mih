<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haryor-Mih Global - Logistics &amp; AutoTrade Platform</title>
    <script>
      // Single Page Apps for GitHub Pages redirect script
      // Preserves repository path for *.github.io subpaths and custom root domains
      var pathSegmentsToKeep = window.location.hostname.endsWith('.github.io') ? 1 : 0;
      var l = window.location;
      var pathParts = l.pathname.split('/').filter(Boolean);
      var repoSegments = pathParts.slice(0, pathSegmentsToKeep);
      var routeSegments = pathParts.slice(pathSegmentsToKeep);
      var repoPath = repoSegments.length > 0 ? '/' + repoSegments.join('/') : '';
      var routePath = routeSegments.join('/').replace(/&/g, '~and~');

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/?/' + routePath +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 40px; color: #333;">
      <h2>Loading Haryor-Mih Logistics...</h2>
      <p>Redirecting to portal application...</p>
    </div>
  </body>
</html>
