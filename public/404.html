<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haryor-Mih Global - Logistics &amp; AutoTrade Platform</title>
    <script>
      // Single Page Apps for GitHub Pages redirect script
      // Redirects 404 URLs back to the root index.html preserving path / query
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 40px; color: #333;">
      <h2>Loading Haryor-Mih Logistics...</h2>
      <p>Redirecting to portal application...</p>
    </div>
  </body>
</html>
